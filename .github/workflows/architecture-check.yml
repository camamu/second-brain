name: Architecture check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check architecture constraints
        run: python scripts/check_architecture.py
