name: Create Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  release:
    # Solo cuando la PR se mergea a main (no cuando se cierra sin merge)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: write   # necesario para crear tags y releases

    outputs:
      release_type: ${{ steps.release_type.outputs.type }}
      version_tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necesario para leer el historial de tags

      - name: Determine release type from branch name and PR labels
        id: release_type
        run: |
          BRANCH='${{ github.event.pull_request.head.ref }}'
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          echo "Rama origen: $BRANCH"
          echo "Labels de la PR: $LABELS"

          if [[ "$BRANCH" == hotfix/* ]]; then
            echo "type=hotfix" >> $GITHUB_OUTPUT
            echo "Tipo: hotfix (patch) — detectado por nombre de rama"
          elif echo "$LABELS" | grep -qi '"release:major"'; then
            echo "type=major" >> $GITHUB_OUTPUT
            echo "Tipo: major"
          else
            echo "type=minor" >> $GITHUB_OUTPUT
            echo "Tipo: minor (por defecto)"
          fi

      - name: Get next version
        id: version
        run: |
          LAST_TAG=$(git tag -l "v*" --sort=-version:refname | head -n 1)
          TYPE="${{ steps.release_type.outputs.type }}"

          if [ -z "$LAST_TAG" ]; then
            case "$TYPE" in
              major)  NEXT="v1.0.0" ;;
              hotfix) NEXT="v0.0.1" ;;
              *)      NEXT="v0.1.0" ;;
            esac
          else
            MAJOR=$(echo $LAST_TAG | cut -d. -f1 | tr -d 'v')
            MINOR=$(echo $LAST_TAG | cut -d. -f2)
            PATCH=$(echo $LAST_TAG | cut -d. -f3)
            case "$TYPE" in
              major)  NEXT="v$((MAJOR + 1)).0.0" ;;
              hotfix) NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
              *)      NEXT="v${MAJOR}.$((MINOR + 1)).0" ;;
            esac
          fi

          echo "tag=$NEXT" >> $GITHUB_OUTPUT
          echo "Próxima versión: $NEXT (tipo: $TYPE)"

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git tag -l "v*" --sort=-version:refname | head -n 1)
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" | head -20)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)")
          fi

          {
            echo "## Cambios en ${{ steps.version.outputs.tag }}"
            echo ""
            echo "**PR:** #${PR_NUMBER} — ${PR_TITLE}"
            echo ""
            echo "$COMMITS"
          } > CHANGELOG_RELEASE.md

          cat CHANGELOG_RELEASE.md

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: false

  deploy:
    needs: release
    uses: ./.github/workflows/deploy-hf-spaces.yml
    secrets: inherit

  sync-develop:
    needs: release
    if: needs.release.outputs.release_type == 'hotfix'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create sync branch and open PR against develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.release.outputs.version_tag }}"
          VERSION_NUM="${VERSION#v}"
          SYNC_BRANCH="internal/sync-develop-with-main-${VERSION_NUM}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$SYNC_BRANCH" origin/main
          git push origin "$SYNC_BRANCH"

          printf "## Sync develop ← main (hotfix %s)\n\n" "$VERSION" > /tmp/pr-body.md
          printf "Esta PR integra en \`develop\` los cambios del hotfix %s mergeado en \`main\`.\n\n" "$VERSION" >> /tmp/pr-body.md
          printf "**Origen:** rama de hotfix mergeada a \`main\` y publicada como release %s.\n" "$VERSION" >> /tmp/pr-body.md
          printf "**Acción requerida:** resolver conflictos si los hay y mergear para mantener \`develop\` al día con \`main\`.\n" >> /tmp/pr-body.md

          gh pr create \
            --base develop \
            --head "$SYNC_BRANCH" \
            --title "chore: sync develop with main after hotfix ${VERSION}" \
            --body-file /tmp/pr-body.md
