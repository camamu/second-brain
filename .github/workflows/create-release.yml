name: Create Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  release:
    # Solo cuando la PR se mergea a main (no cuando se cierra sin merge)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: write   # necesario para crear tags y releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necesario para leer el historial de tags

      - name: Determine release type from PR labels
        id: release_type
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          echo "Labels de la PR: $LABELS"

          if echo "$LABELS" | grep -qi '"release:major"'; then
            echo "type=major" >> $GITHUB_OUTPUT
            echo "Tipo: major"
          elif echo "$LABELS" | grep -qi '"release:hotfix"'; then
            echo "type=hotfix" >> $GITHUB_OUTPUT
            echo "Tipo: hotfix (patch)"
          else
            echo "type=minor" >> $GITHUB_OUTPUT
            echo "Tipo: minor (por defecto)"
          fi

      - name: Get next version
        id: version
        run: |
          LAST_TAG=$(git tag -l "v*" --sort=-version:refname | head -n 1)
          TYPE="${{ steps.release_type.outputs.type }}"

          if [ -z "$LAST_TAG" ]; then
            case "$TYPE" in
              major)  NEXT="v1.0.0" ;;
              hotfix) NEXT="v0.0.1" ;;
              *)      NEXT="v0.1.0" ;;
            esac
          else
            MAJOR=$(echo $LAST_TAG | cut -d. -f1 | tr -d 'v')
            MINOR=$(echo $LAST_TAG | cut -d. -f2)
            PATCH=$(echo $LAST_TAG | cut -d. -f3)
            case "$TYPE" in
              major)  NEXT="v$((MAJOR + 1)).0.0" ;;
              hotfix) NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
              *)      NEXT="v${MAJOR}.$((MINOR + 1)).0" ;;
            esac
          fi

          echo "tag=$NEXT" >> $GITHUB_OUTPUT
          echo "Próxima versión: $NEXT (tipo: $TYPE)"

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git tag -l "v*" --sort=-version:refname | head -n 1)
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" | head -20)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)")
          fi

          {
            echo "## Cambios en ${{ steps.version.outputs.tag }}"
            echo ""
            echo "**PR:** #${PR_NUMBER} — ${PR_TITLE}"
            echo ""
            echo "$COMMITS"
          } > CHANGELOG_RELEASE.md

          cat CHANGELOG_RELEASE.md

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: false

  deploy:
    needs: release
    uses: ./.github/workflows/deploy-hf-spaces.yml
    secrets: inherit
